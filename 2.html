<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熵变闯关</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [
                    ['$', '$']
                ],
                displayMath: [
                    ['$$', '$$']
                ],
                processEscapes: true,
                packages: { '[+]': ['mhchem'] }
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process'
            },
            loader: {
                load: ['[tex]/mhchem']
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'SimSun', '瀹嬩綋', 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            min-height: 100vh;
            background: #0b1424;
            background-image: radial-gradient(ellipse at 20% 30%, #1a2a3a, #0b1424);
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #particleCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .game-wrapper {
            position: relative;
            z-index: 1;
            width: 1100px;
            max-width: 96vw;
            height: auto;
            min-height: 600px;
            max-height: 92vh;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-radius: 60px 60px 40px 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 30px 30px 25px;
        }
        .hidden {
            display: none !important;
        }
        #menuPanel {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 25px 30px 20px;
            z-index: 10;
            background: inherit;
            border-radius: inherit;
            justify-content: space-between;
            align-items: center;
        }
        .menu-header-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .menu-header-area h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: 1px;
            text-shadow: 0 2px 16px rgba(100, 180, 255, 0.2);
        }
        .menu-header-area .menu-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin: 0 0 12px 0;
        }
        .menu-header-area .choice-btn {
            background: rgba(0, 220, 255, 0.15);
            border: 1px solid rgba(0, 220, 255, 0.3);
            padding: 8px 24px;
            border-radius: 30px;
            color: #a0e0ff;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.08);
            cursor: default;
        }
        .back-btn {
            padding: 6px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-family: 'SimSun', '瀹嬩綋', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }
        .menu-cards {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 30px;
            flex: 1;
            padding: 5px 0;
            width: 100%;
        }
        .menu-card {
            flex: 0 0 260px;
            max-width: 320px;
            width: 100%;
            min-height: 180px;
            border-radius: 24px;
            padding: 25px 20px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            color: #fff;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .menu-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .menu-card:active {
            transform: scale(0.96);
        }
        .card-apple {
            background: rgba(100, 140, 160, 0.15);
            backdrop-filter: blur(8px);
        }
        .card-mole {
            background: rgba(140, 80, 200, 0.12);
            backdrop-filter: blur(8px);
        }
        .menu-card .card-emoji {
            font-size: 46px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.1));
        }
        .menu-card .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .menu-card .card-desc {
            font-size: 12px;
            opacity: 0.7;
            line-height: 1.5;
            margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        .menu-card .card-btn {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
        }
        .menu-card:hover .card-btn {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .menu-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            flex-shrink: 0;
        }
        .menu-footer .bottom-back-btn {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            padding: 6px 20px;
        }
        .menu-footer .bottom-back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .menu-footer .footer-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }
        .menu-footer .footer-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
        }
        #gamePanel {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px 14px 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar .left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-bar .left-group .back-btn {
            font-size: 13px;
            padding: 6px 14px;
        }
        .top-bar .corn-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 700;
            color: #ffdd77;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.3);
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 22px 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .top-bar .corn-display .corn-icon {
            font-size: 34px;
            line-height: 1;
        }
        .top-bar .corn-display .corn-num {
            min-width: 36px;
            text-align: center;
            font-size: 30px;
        }
        .top-bar .timer-display {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 26px;
            font-weight: 700;
            color: #aad0ff;
            text-shadow: 0 0 16px rgba(100, 180, 255, 0.25);
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 22px 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(100, 180, 255, 0.15);
        }
        .top-bar .timer-display .timer-icon {
            font-size: 28px;
        }
        .top-bar .timer-display .timer-num {
            min-width: 44px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .top-bar .timer-display .timer-num.warning {
            color: #ff8a7a;
            animation: pulseWarn 0.6s ease-in-out infinite alternate;
        }
        @keyframes pulseWarn {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(1.06); }
        }
        .top-bar .progress-display {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .main-area {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
            height: 100%;
        }
        .question-area {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0;
            min-height: 120px;
        }
        .question-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 24px 28px 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .question-number {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .question-tags {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .difficulty-tag {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .difficulty-tag.easy {
            background: rgba(74, 222, 128, 0.18);
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.25);
        }
        .difficulty-tag.medium {
            background: rgba(251, 191, 36, 0.18);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.25);
        }
        .difficulty-tag.hard {
            background: rgba(248, 113, 113, 0.18);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.25);
        }
        .score-tag {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: rgba(255, 215, 0, 0.15);
            color: #ffdd77;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .question-text {
            font-size: 22px;
            font-weight: 600;
            color: #f0f4ff;
            line-height: 1.6;
            text-shadow: 0 2px 12px rgba(100, 180, 255, 0.08);
            font-family: 'SimSun', '瀹嬩綋', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            word-break: break-word;
        }
        .question-text .tex2jax_process {
            font-weight: 500;
        }
        .question-hint {
            margin-top: 12px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
        }
        .question-hint .hint-icon {
            font-size: 18px;
            margin-right: 6px;
        }
        .holes-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px 0;
            position: relative;
        }
        .holes-row {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            width: 100%;
        }
        .hole-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.15s;
            position: relative;
            z-index: 1;
        }
        .hole-wrapper:active {
            transform: scale(0.94);
        }
        .hole-wrapper.disabled {
            pointer-events: none;
            opacity: 0.5;
        }
        .hole-container {
            position: relative;
            width: 160px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hole-container .apple {
            position: relative;
            width: 120px;
            height: 120px;
            z-index: 10;
            transition: all 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
            transform-origin: center center;
        }
        .hole-container .apple .apple-stem {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%) rotate(-15deg);
            width: 8px;
            height: 22px;
            background: linear-gradient(to right, #8B6914, #5a4510);
            border-radius: 4px 4px 2px 2px;
            z-index: 2;
        }
        .hole-container .apple .apple-leaf {
            position: absolute;
            top: -6px;
            left: calc(50% + 4px);
            width: 28px;
            height: 16px;
            background: linear-gradient(135deg, #56c445, #3a9a2e);
            border-radius: 50% 0 50% 50%;
            z-index: 3;
            transform: rotate(25deg);
            box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .hole-container .apple .apple-body {
            position: absolute;
            inset: 0;
            border-radius: 42% 42% 48% 48% / 35% 35% 65% 65%;
            background: radial-gradient(ellipse at 35% 25%, #ff5a5a 5%, #e02020 30%, #c01010 70%, #8a0000 100%);
            box-shadow: inset -10px -10px 30px rgba(0, 0, 0, 0.3), inset 10px 8px 30px rgba(255, 150, 150, 0.2), 0 8px 20px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .hole-container .apple .apple-body::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 20%;
            width: 35%;
            height: 28%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(4px);
            transform: rotate(-30deg);
        }
        .hole-container .apple .apple-body .bad-spots {
            display: none;
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }
        .hole-container .apple .apple-body .bad-spots::before,
        .hole-container .apple .apple-body .bad-spots::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(60, 30, 0, 0.55);
        }
        .hole-container .apple .apple-body .bad-spots::before {
            width: 30px;
            height: 22px;
            top: 30%;
            left: 20%;
            transform: rotate(15deg);
        }
        .hole-container .apple .apple-body .bad-spots::after {
            width: 24px;
            height: 18px;
            top: 55%;
            left: 50%;
            transform: rotate(-20deg);
        }
        .hole-container .apple .apple-inner {
            display: none;
            position: absolute;
            inset: 0;
            border-radius: 42% 42% 48% 48% / 35% 35% 65% 65%;
            background: radial-gradient(ellipse at center, #fffbe6, #fff3c0 60%, #ffe080 100%);
            box-shadow: inset 0 0 30px rgba(255, 220, 50, 0.3), 0 8px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .hole-container .apple .apple-inner::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            border: 3px solid rgba(200, 170, 50, 0.3);
        }
        .hole-container .apple .apple-inner .seed {
            position: absolute;
            width: 10px;
            height: 6px;
            background: radial-gradient(ellipse, #8B6914, #5a4010);
            border-radius: 50%;
            transform: rotate(25deg);
        }
        .hole-container .apple .apple-inner .seed:nth-child(1) {
            top: 38%;
            left: 32%;
            transform: rotate(20deg);
        }
        .hole-container .apple .apple-inner .seed:nth-child(2) {
            top: 38%;
            right: 32%;
            transform: rotate(-20deg);
        }
        .hole-container .apple .apple-inner .seed:nth-child(3) {
            top: 52%;
            left: 44%;
            transform: rotate(0deg);
        }
        @keyframes cutApple {
            0% { transform: scale(1) rotateY(0deg); }
            50% { transform: scale(1.1) rotateY(20deg); }
            100% { transform: scale(1) rotateY(0deg); }
        }
        @keyframes cutWrongApple {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(0.9) rotate(-5deg); }
            60% { transform: scale(0.85) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .hole-container .apple.cut-good {
            animation: cutApple 0.6s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }
        .hole-container .apple.cut-good .apple-body {
            display: none;
        }
        .hole-container .apple.cut-good .apple-stem,
        .hole-container .apple.cut-good .apple-leaf {
            z-index: 20;
        }
        .hole-container .apple.cut-good .apple-inner {
            display: block;
        }
        .hole-container .apple.cut-bad {
            animation: cutWrongApple 0.5s ease-out forwards;
        }
        .hole-container .apple.cut-bad .apple-body {
            background: radial-gradient(ellipse at 35% 25%, #a08050 5%, #7a5a20 30%, #5a3a10 70%, #3a2000 100%);
            box-shadow: inset -10px -10px 30px rgba(0, 0, 0, 0.4), inset 10px 8px 30px rgba(100, 80, 50, 0.15), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .hole-container .apple.cut-bad .apple-body .bad-spots {
            display: block;
        }
        .hole-container .apple.cut-bad .apple-stem {
            opacity: 0.6;
        }
        .hole-container .apple.cut-bad .apple-leaf {
            opacity: 0.5;
            background: linear-gradient(135deg, #888, #555);
        }
        .hole-container .apple.cut-good .stars {
            display: block !important;
            position: absolute;
            inset: -20px;
            pointer-events: none;
            z-index: 30;
        }
        .hole-container .apple.cut-good .stars span {
            position: absolute;
            font-size: 22px;
            animation: starFloat 1.2s ease-in-out infinite alternate;
            opacity: 0.9;
            text-shadow: 0 0 12px rgba(255, 255, 100, 0.6);
        }
        .hole-container .apple.cut-good .stars span:nth-child(1) {
            top: -12px;
            left: 4px;
            animation-delay: 0s;
            font-size: 28px;
        }
        .hole-container .apple.cut-good .stars span:nth-child(2) {
            top: -6px;
            right: 0px;
            animation-delay: 0.3s;
            font-size: 20px;
        }
        .hole-container .apple.cut-good .stars span:nth-child(3) {
            bottom: -6px;
            left: -10px;
            animation-delay: 0.6s;
            font-size: 18px;
        }
        .hole-container .apple.cut-good .stars span:nth-child(4) {
            bottom: 0px;
            right: -6px;
            animation-delay: 0.9s;
            font-size: 24px;
        }
        @keyframes starFloat {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0.6; }
            100% { transform: translateY(-14px) rotate(30deg) scale(1.2); opacity: 1; }
        }
        .hole-label {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            margin-top: 4px;
            letter-spacing: 2px;
            font-family: 'SimSun', '瀹嬩綋', 'Comic Sans MS', cursive;
        }
        .hole-label .label-icon {
            margin-right: 6px;
        }
        .skip-btn {
            margin-top: 14px;
            padding: 10px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'SimSun', '瀹嬩綋', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.5px;
        }
        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
            transform: scale(1.02);
        }
        .skip-btn:active {
            transform: scale(0.94);
        }
        .skip-btn.disabled {
            pointer-events: none;
            opacity: 0.3;
        }
        .result-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px 60px 40px 40px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 40px;
        }
        .result-overlay.show {
            display: flex;
        }
        .result-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 48px 56px 44px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 480px;
            width: 100%;

    <script>
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 110;
            const MAX_R = 2.8;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.r = Math.random() * MAX_R + 0.6;
                    this.speedX = (Math.random() - 0.5) * 0.35;
                    this.speedY = (Math.random() - 0.5) * 0.35;
                    this.alpha = Math.random() * 0.5 + 0.2;
                    this.hue = Math.random() * 60 + 200;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < -10 || this.x > w + 10 || this.y < -10 || this.y > h + 10) { this.reset(); }
                    this.alpha = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(Date.now() / 2000 + this.x));
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${this.alpha})`;
                    ctx.fill();
                    if (this.r > 1.5) {
                        ctx.shadowColor = `hsla(${this.hue}, 80%, 70%, 0.15)`;
                        ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }
            for (let i = 0; i < COUNT; i++) {
                const p = new Particle();
                p.x = Math.random() * w;
                p.y = Math.random() * h;
                particles.push(p);
            }
            function drawLines() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i],
                            b = particles[j];
                        const dx = a.x - b.x,
                            dy = a.y - b.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            const alpha = (1 - dist / 120) * 0.12;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(180, 210, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }
            function animate() {
                ctx.clearRect(0, 0, w, h);
                const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
                grad.addColorStop(0, '#13203a');
                grad.addColorStop(0.5, '#0b1424');
                grad.addColorStop(1, '#060a14');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
                for (const p of particles) { p.update();
                    p.draw(); }
                drawLines();
                requestAnimationFrame(animate);
            }
            animate();
        })();

        const progressText = document.getElementById('progressText');
        const resultOverlay = document.getElementById('resultOverlay');
        const finalCornCount = document.getElementById('finalCornCount');
        const finalDetail = document.getElementById('finalDetail');
        const resultStars = document.getElementById('resultStars');
        const questionCard = document.getElementById('questionCard');
        const skipBtn = document.getElementById('skipBtn');
        function initQuestions() {
            shuffledQuestions = questionData.map((item, idx) => ({ ...item, originalIdx: idx + 1 }));
        }
        function showMenu() {
            menuPanel.classList.remove('hidden');
            gamePanel.classList.add('hidden');
            stopTimer();
            isGameActive = false;
            isAnswering = false;
        }
        function startGame() {
            menuPanel.classList.add('hidden');
            gamePanel.classList.remove('hidden');
            cornCount = 0;
            currentIndex = 0;
            cornCountEl.textContent = '0分';
            resultOverlay.classList.remove('show');
            initQuestions();
            resetMoles();
            wrapperCorrect.classList.remove('disabled');
            wrapperWrong.classList.remove('disabled');
            skipBtn.classList.remove('disabled');
            isAnswering = false;
            isGameActive = false;
            stopTimer();
            timerDisplay.textContent = '30';
            timerDisplay.classList.remove('warning');
            loadQuestion(0);
        }
        function goToMenu() {
            stopTimer();
            isGameActive = false;
            isAnswering = false;
            resultOverlay.classList.remove('show');
            showMenu();
        }
        function resetApple(apple) {
            apple.classList.remove('cut-good', 'cut-bad');
            const stars = apple.querySelector('.stars');
            if (stars) stars.style.display = 'none';
            const body = apple.querySelector('.apple-body');
            if (body) {
                body.style.background = '';
                body.style.boxShadow = '';
            }
            const leaf = apple.querySelector('.apple-leaf');
            if (leaf) { leaf.style.opacity = '1';
                leaf.style.background = ''; }
            const stem = apple.querySelector('.apple-stem');
            if (stem) stem.style.opacity = '1';
        }
        function resetMoles() {
            [appleCorrect, appleWrong].forEach(apple => resetApple(apple));
        }
        function startTimer() {
            clearInterval(timerInterval);
            timer = 30;
            timerDisplay.textContent = timer;
            timerDisplay.classList.remove('warning');
            timerInterval = setInterval(() => {
                timer--;
                timerDisplay.textContent = timer;
                if (timer <= 5) { timerDisplay.classList.add('warning'); }
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }
        function stopTimer() {
            clearInterval(timerInterval);
            timerDisplay.classList.remove('warning');
        }
        function loadQuestion(index) {
            if (index >= shuffledQuestions.length) {
                endGame();
                return;
            }
            const data = shuffledQuestions[index];
            qText.textContent = data.q;
            qNumber.textContent = `第 ${index + 1} 题`;
            qDifficulty.textContent = data.difficulty;
            qDifficulty.className = 'difficulty-tag';
            if (data.difficulty === '简单') {
                qDifficulty.classList.add('easy');
            } else if (data.difficulty === '中等') {
                qDifficulty.classList.add('medium');
            } else if (data.difficulty === '困难') {
                qDifficulty.classList.add('hard');
            }
            qScore.textContent = data.score + '分';
            progressText.textContent = `${index + 1} / ${shuffledQuestions.length}`;
            qHint.innerHTML = `<span><span class="hint-icon">🍎</span>点击苹果切开选择答案</span>`;
            resetMoles();
            wrapperCorrect.classList.remove('disabled');
            wrapperWrong.classList.remove('disabled');
            skipBtn.classList.remove('disabled');
            nextBtn.style.display = 'none';
            isAnswering = false;
            isGameActive = true;
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionCard]).catch(err => console.error(err));
            }
            startTimer();
        }
        function showAppleState(apple, state) {
            resetApple(apple);
            if (state === 'good') {
                apple.classList.add('cut-good');
                const stars = apple.querySelector('.stars');
                if (stars) stars.style.display = 'block';
            } else if (state === 'bad') {
                apple.classList.add('cut-bad');
            }
        }
        function handleAnswer(selected) {
            if (!isGameActive || isAnswering) return;
            if (currentIndex >= shuffledQuestions.length) return;
            const data = shuffledQuestions[currentIndex];
            const correct = data.ans;
            const isCorrect = (selected === correct);
            const scoreValue = data.score;
            isAnswering = true;
            stopTimer();
            isGameActive = false;
            wrapperCorrect.classList.add('disabled');
            wrapperWrong.classList.add('disabled');
            skipBtn.classList.add('disabled');
            const correctApple = correct === '对' ? appleCorrect : appleWrong;
            const wrongApple = correct === '对' ? appleWrong : appleCorrect;
            if (isCorrect) {
                showAppleState(correctApple, 'good');
                cornCount += scoreValue;
                cornCountEl.textContent = cornCount + '分';
                const container = correctApple.closest('.hole-container');
                spawnCornFly(container);
                qHint.innerHTML = `<span style="color:#4ade80;">🎉 答对了！ +${scoreValue} 分</span>`;
            } else {
                showAppleState(wrongApple, 'bad');
                setTimeout(() => showAppleState(correctApple, 'good'), 600);
                cornCount -= scoreValue;
                cornCountEl.textContent = cornCount + '分';
                qHint.innerHTML = `
                    <span style="color:#f87171;">😅 答错了！ -${scoreValue} 分　正确答案是 "<strong>${correct}</strong>"</span>
                    <span style="display:block;margin-top:6px;color:#c8d6e5;font-size:14px;line-height:1.5;">💡 解析：${data.explain}</span>
                `;
            }
            const isLast = (currentIndex + 1 >= shuffledQuestions.length);
            nextBtn.textContent = isLast ? '查看结果 🏁' : '下一题 →';
            nextBtn.style.display = 'block';
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionCard]).catch(err => console.error(err));
            }
        }
        function handleTimeout() {
            if (!isGameActive || isAnswering) return;
            if (currentIndex >= shuffledQuestions.length) return;
            const data = shuffledQuestions[currentIndex];
            const correct = data.ans;
            isAnswering = true;
            stopTimer();
            isGameActive = false;
            wrapperCorrect.classList.add('disabled');
            wrapperWrong.classList.add('disabled');
            skipBtn.classList.add('disabled');
            const correctApple = correct === '对' ? appleCorrect : appleWrong;
            showAppleState(correctApple, 'good');
            qHint.innerHTML = `
                <span style="color:#f87171;">⏰ 时间到！正确答案是 "<strong>${correct}</strong>"</span>
                <span style="display:block;margin-top:6px;color:#c8d6e5;font-size:14px;line-height:1.5;">💡 解析：${data.explain}</span>
            `;
            const isLast = (currentIndex + 1 >= shuffledQuestions.length);
            nextBtn.textContent = isLast ? '查看结果 🏁' : '下一题 →';
            nextBtn.style.display = 'block';
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionCard]).catch(err => console.error(err));
            }
        }
        function handleSkip() {
            if (!isGameActive || isAnswering) return;
            if (currentIndex >= shuffledQuestions.length) return;
            isAnswering = true;
            stopTimer();
            isGameActive = false;
            wrapperCorrect.classList.add('disabled');
            wrapperWrong.classList.add('disabled');
            skipBtn.classList.add('disabled');
            const data = shuffledQuestions[currentIndex];
            const correct = data.ans;
            qHint.innerHTML = `
                <span style="color:#94a3b8;">⏭️ 已跳过此题　正确答案是 "<strong>${correct}</strong>"</span>
                <span style="display:block;margin-top:6px;color:#c8d6e5;font-size:14px;line-height:1.5;">💡 解析：${data.explain}</span>
            `;
            const isLast = (currentIndex + 1 >= shuffledQuestions.length);
            nextBtn.textContent = isLast ? '查看结果 🏁' : '下一题 →';
            nextBtn.style.display = 'block';
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionCard]).catch(err => console.error(err));
            }
        }
        function goNext() {
            if (nextBtn.style.display === 'none') return;
            nextBtn.style.display = 'none';
            currentIndex++;
            if (currentIndex < shuffledQuestions.length) {
                loadQuestion(currentIndex);
            } else {
                endGame();
            }
        }
        function getStars(score) {
            let fullStars = 0;
            let hasHalf = false;
            if (score <= 0) {
            } else if (score < 20) {
                hasHalf = true;
            } else if (score === 20) {
                fullStars = 1;
            } else if (score < 40) {
                fullStars = 1;
                hasHalf = true;
            } else if (score === 40) {
                fullStars = 2;
            } else if (score < 60) {
                fullStars = 2;
                hasHalf = true;
            } else if (score === 60) {
                fullStars = 3;
            } else if (score < 80) {
                fullStars = 3;
                hasHalf = true;
            } else if (score === 80) {
                fullStars = 4;
            } else if (score < 100) {
                fullStars = 4;
                hasHalf = true;
            } else if (score === 100) {
                fullStars = 5;
            }
            return { fullStars, hasHalf };
        }
        function renderStars(score) {
            const { fullStars, hasHalf } = getStars(score);
            let html = '';
            for (let i = 0; i < fullStars; i++) {
                html += `<span class="star-wrap"><span class="star-full">⭐</span></span>`;
            }
            if (hasHalf) {
                html += `<span class="star-wrap"><span class="star-half">⭐</span></span>`;
            }
            if (fullStars === 0 && !hasHalf) {
                html += `<span style="color:#444;font-size:42px;line-height:1;">☆</span>`;
                html += `<span style="color:#444;font-size:14px;margin-left:6px;opacity:0.5;">（未获得星星）</span>`;
            }
            return html;
        }
        function endGame() {
            stopTimer();
            isGameActive = false;
            isAnswering = true;
            resetMoles();
            wrapperCorrect.classList.add('disabled');
            wrapperWrong.classList.add('disabled');
            skipBtn.classList.add('disabled');
            finalCornCount.textContent = cornCount + '分';
            const total = shuffledQuestions.length;
            finalDetail.textContent = `共 ${total} 题，获得 ${cornCount} 分`;
            resultStars.innerHTML = renderStars(cornCount);
            resultOverlay.classList.add('show');
        }
        function restartGame() {
            resultOverlay.classList.remove('show');
            cornCount = 0;
            cornCountEl.textContent = '0分';
            currentIndex = 0;
            initQuestions();
            resetMoles();
            wrapperCorrect.classList.remove('disabled');
            wrapperWrong.classList.remove('disabled');
            skipBtn.classList.remove('disabled');
            isAnswering = false;
            isGameActive = false;
            stopTimer();
            timerDisplay.textContent = '30';
            timerDisplay.classList.remove('warning');
            loadQuestion(0);
        }
        function spawnCornFly(anchorEl) {
            const rect = anchorEl.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'corn-fly';
            el.textContent = '⭐';
            el.style.left = (rect.left + rect.width / 2 - 24) + 'px';
            el.style.top = (rect.top - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 1000);
        }
        wrapperCorrect.addEventListener('click', () => { handleAnswer('对'); });
        wrapperWrong.addEventListener('click', () => { handleAnswer('错'); });
        window.onload = function() {
            showMenu();
            initQuestions();
        };
    </script>
</body>
</html>
