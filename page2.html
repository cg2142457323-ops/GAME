<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>热力学熵变计算器</title>

    <!-- 仅依赖 Chart.js 核心库，移除不稳定的注解插件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>

    <style>
        /* ── 全局样式 ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 24px;
            color: #1e293b;
        }
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 28px 32px 36px;
        }

        /* ── 标题 ── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #e9eef3;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #0b2b4a;
        }
        .app-header .badge {
            background: #d0e2f2;
            color: #1a4b6d;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 500;
            margin-left: 8px;
        }

        /* ── 输入行 ── */
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: flex-end;
            background: #f8fafc;
            padding: 20px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1 1 160px;
            min-width: 140px;
        }
        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
        .input-group input {
            padding: 10px 14px;
            border: 1.5px solid #d1d9e6;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            transition: border 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            outline: none;
            border-color: #2a7de1;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.15);
        }
        .btn-calc {
            background: #1a5f9e;
            color: #fff;
            border: none;
            padding: 10px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex: 0 0 auto;
            height: 44px;
            align-self: flex-end;
        }
        .btn-calc:hover {
            background: #134a7a;
        }
        .btn-calc:active {
            transform: scale(0.97);
        }

        /* ── 退出按钮样式（修改为返回游戏） ── */
        .btn-exit {
            background: #6b7280;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex: 0 0 auto;
            height: 44px;
            align-self: flex-end;
            margin-left: 4px;
        }
        .btn-exit:hover {
            background: #4b5563;
        }
        .btn-exit:active {
            transform: scale(0.97);
        }

        /* ── 结果卡片 ── */
        .result-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
        }
        .result-card {
            flex: 1 1 180px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px 20px;
            border-left: 5px solid #2a7de1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .result-card .label {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }
        .result-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #0b2b4a;
            margin-top: 2px;
            font-family: 'Courier New', monospace;
        }
        .result-card .unit {
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
        }
        .card-sys {
            border-left-color: #2563eb;
        }
        .card-surr {
            border-left-color: #dc2626;
        }
        .card-total {
            border-left-color: #1e293b;
        }

        /* ── 消息 ── */
        .msg-bar {
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            background: #f1f5f9;
            color: #334155;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .msg-bar.success {
            background: #e6f7e6;
            color: #0a6b3a;
        }
        .msg-bar.error {
            background: #fee9e7;
            color: #b91c1c;
        }
        .msg-bar.info {
            background: #e6f0fa;
            color: #1a4b6d;
        }

        /* ── 图表区 ── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 6px;
        }
        .chart-box {
            background: #fafcfe;
            border-radius: 16px;
            padding: 16px 12px 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf2;
        }
        .chart-box h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            margin-bottom: 6px;
        }
        .chart-box canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 240px;
        }

        /* ── 模态框 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 28px 34px 24px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-box h2 {
            font-size: 18px;
            font-weight: 600;
            color: #0b2b4a;
            margin-bottom: 6px;
        }
        .modal-box .sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .modal-box .field {
            margin-bottom: 12px;
        }
        .modal-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 3px;
        }
        .modal-box .field input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
        }
        .modal-box .field input:focus {
            border-color: #2a7de1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(42, 125, 225, 0.12);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 8px 28px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-actions .btn-confirm {
            background: #1a5f9e;
            color: #fff;
        }
        .modal-actions .btn-confirm:hover {
            background: #134a7a;
        }
        .modal-actions .btn-cancel {
            background: #e9eef3;
            color: #334155;
        }
        .modal-actions .btn-cancel:hover {
            background: #d5dce3;
        }

        /* ── 响应式 ── */
        @media (max-width: 820px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
            .app-container {
                padding: 18px 16px;
            }
            .input-row {
                padding: 16px;
            }
        }
        @media (max-width: 520px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .result-cards {
                flex-direction: column;
            }
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-calc,
            .btn-exit {
                align-self: stretch;
                margin-left: 0;
                margin-top: 6px;
            }
            .app-header h1 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 标题 -->
        <div class="app-header">
            <h1>⚡ 热力学熵变计算器</h1>
            <span class="badge">集成数据库 · 43种化合物</span>
        </div>

        <!-- 输入区域 -->
        <div class="input-row">
            <div class="input-group">
                <label>反应物</label>
                <input id="reactants" value="CaCO3" placeholder="如 CaCO3,CaO" />
            </div>
            <div class="input-group">
                <label>生成物</label>
                <input id="products" value="CaO,CO2" placeholder="如 CaO,CO2" />
            </div>
            <div class="input-group" style="flex:0 0 130px;">
                <label>温度 T (K) ≥ 273.15</label>
                <input id="temperature" value="1200" type="number" step="1" min="273.15" />
            </div>
            <div style="display: flex; align-items: center;">
                <button class="btn-calc" id="calcBtn">🔬 计算并绘图</button>
                <button class="btn-exit" id="exitBtn">🏠 返回游戏</button>
            </div>
        </div>

        <!-- 结果卡片 -->
        <div class="result-cards">
            <div class="result-card card-sys">
                <div class="label">系统熵变 ΔS<sub>系</sub></div>
                <div class="value" id="resSys">—</div>
                <div class="unit">J/(mol·K)</div>
            </div>
            <div class="result-card card-surr">
                <div class="label">环境熵变 ΔS<sub>环</sub></div>
                <div class="value" id="resSurr">—</div>
                <div class="unit">J/(mol·K)</div>
            </div>
            <div class="result-card card-total">
                <div class="label">总熵变 ΔS<sub>总</sub></div>
                <div class="value" id="resTotal">—</div>
                <div class="unit">J/(mol·K)</div>
            </div>
        </div>

        <!-- 消息栏 -->
        <div class="msg-bar info" id="msgBar">💡 输入化合物名称，点击「计算并绘图」查看结果</div>

        <!-- 图表区 -->
        <div class="charts-grid">
            <div class="chart-box">
                <h3>📈 系统熵变 ΔS<sub>系</sub></h3>
                <canvas id="chartSys"></canvas>
            </div>
            <div class="chart-box">
                <h3>📈 环境熵变 ΔS<sub>环</sub></h3>
                <canvas id="chartSurr"></canvas>
            </div>
            <div class="chart-box">
                <h3>📈 总熵变 ΔS<sub>总</sub></h3>
                <canvas id="chartTotal"></canvas>
            </div>
        </div>
    </div>

    <!-- ====== 模态框：补充化合物数据 ====== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 id="modalTitle">🧪 补充化合物数据</h2>
            <div class="sub" id="modalSub">请输入该化合物的热力学参数</div>
            <div class="field">
                <label>标准熵 S° (J/(mol·K))</label>
                <input id="modalS" type="number" step="any" value="0" />
            </div>
            <div class="field">
                <label>标准生成焓 ΔHf° (kJ/mol)</label>
                <input id="modalHf" type="number" step="any" value="0" />
            </div>
            <div class="field">
                <label>等压热容 Cp° (J/(mol·K))</label>
                <input id="modalCp" type="number" step="any" value="0" />
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">✓ 确认</button>
            </div>
        </div>
    </div>

    <script>
        // ======================================================================
        //  1. 化合物数据库 (与 MATLAB 完全一致)
        // ======================================================================
        const RAW_DATA = [
            "CaCO3 91.7 -1207.6 83.5",
            "CaO 38.1 -634.9 42.0",
            "CO2 213.8 -393.5 37.1",
            "H2O 70.0 -285.8 75.3",
            "H2O(g) 188.8 -241.8 33.6",
            "O2 205.2 0 29.4",
            "N2 191.6 0 29.1",
            "H2 130.7 0 28.8",
            "CO 197.7 -110.5 29.1",
            "C 5.7 0 8.5",
            "Cl2 223.1 0 33.9",
            "S 32.1 0 22.6",
            "NaOH 64.5 -425.6 59.5",
            "NaCl 72.1 -411.2 50.5",
            "Na2CO3 135.0 -1130.7 112.3",
            "Al2O3 50.9 -1675.7 79.0",
            "Fe2O3 87.4 -824.2 103.9",
            "SiO2 41.5 -910.7 44.4",
            "MgO 27.0 -601.6 37.2",
            "Ca(OH)2 83.4 -985.2 87.5",
            "CaCl2 108.4 -795.4 72.9",
            "Na2SO4 149.6 -1387.1 128.2",
            "KCl 82.6 -436.5 51.3",
            "KNO3 133.1 -494.6 96.4",
            "NH4Cl 94.6 -314.4 84.1",
            "AgCl 96.3 -127.0 50.8",
            "Ag2O 121.3 -31.1 65.9",
            "BaSO4 132.2 -1473.2 101.8",
            "ZnO 43.7 -350.5 40.3",
            "CuO 42.6 -157.3 42.3",
            "FeS 60.3 -100.0 50.5",
            "MnCO3 85.8 -894.1 81.5",
            "TiCl4 252.3 -763.2 145.2",
            "SiCl4 239.7 -687.0 145.3",
            "PCl3 217.1 -319.7 0",
            "SO2 248.2 -296.8 39.9",
            "SO3 256.8 -395.7 50.7",
            "NO 210.8 90.3 29.9",
            "NO2 240.1 33.2 37.2",
            "NH3 192.8 -45.9 35.1",
            "HNO3 155.6 -174.1 109.9",
            "H2SO4 156.9 -814.0 138.9",
            "CH4 186.3 -74.8 35.3",
            "C2H6 229.6 -84.7 52.6"
        ];

        // 构建数据库 Map: name -> { S, Hf, Cp }
        const compDB = new Map();
        for (const line of RAW_DATA) {
            const parts = line.trim().split(/\s+/);
            if (parts.length < 4) continue;
            const name = parts[0];
            const S = parseFloat(parts[1]);
            const Hf = parseFloat(parts[2]);
            const Cp = parseFloat(parts[3]);
            compDB.set(name, { S, Hf, Cp });
            // 兼容处理：若名称带 (g) / (l)，同时存一份无后缀版本
            if (name.includes('(')) {
                const clean = name.replace(/\([gl]\)/g, '').trim();
                if (clean && !compDB.has(clean)) {
                    compDB.set(clean, { S, Hf, Cp });
                }
            }
        }

        // 临时用户补充数据 (会话级)
        const userDB = new Map();

        // ======================================================================
        //  2. DOM 引用
        // ======================================================================
        const elReact = document.getElementById('reactants');
        const elProd = document.getElementById('products');
        const elTemp = document.getElementById('temperature');
        const elCalc = document.getElementById('calcBtn');
        const elExit = document.getElementById('exitBtn');
        const elMsg = document.getElementById('msgBar');
        const elResSys = document.getElementById('resSys');
        const elResSurr = document.getElementById('resSurr');
        const elResTotal = document.getElementById('resTotal');

        // 三个 canvas
        const canvasSys = document.getElementById('chartSys');
        const canvasSurr = document.getElementById('chartSurr');
        const canvasTotal = document.getElementById('chartTotal');

        // 模态框
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSub = document.getElementById('modalSub');
        const modalS = document.getElementById('modalS');
        const modalHf = document.getElementById('modalHf');
        const modalCp = document.getElementById('modalCp');
        const modalConfirm = document.getElementById('modalConfirm');
        const modalCancel = document.getElementById('modalCancel');

        // ======================================================================
        //  3. 图表实例缓存
        // ======================================================================
        let chartSys = null;
        let chartSurr = null;
        let chartTotal = null;

        // ======================================================================
        //  4. 核心函数：获取化合物数据 (支持弹窗补充)
        // ======================================================================
        function getCompoundData(name) {
            // 1) 内置数据库
            if (compDB.has(name)) {
                return compDB.get(name);
            }
            // 2) 用户临时补充
            if (userDB.has(name)) {
                return userDB.get(name);
            }
            // 3) 弹窗询问
            return new Promise((resolve, reject) => {
                // 显示模态框
                modalTitle.textContent = `🧪 补充化合物: ${name}`;
                modalSub.textContent = `未找到 "${name}" 的热力学数据，请手动输入：`;
                modalS.value = '0';
                modalHf.value = '0';
                modalCp.value = '0';
                modalOverlay.classList.add('active');

                // 清除旧监听，避免重复
                const onConfirm = () => {
                    const S = parseFloat(modalS.value);
                    const Hf = parseFloat(modalHf.value);
                    const Cp = parseFloat(modalCp.value);
                    if (isNaN(S) || isNaN(Hf) || isNaN(Cp)) {
                        alert('请输入有效的数字！');
                        return;
                    }
                    const data = { S, Hf, Cp };
                    userDB.set(name, data);
                    modalOverlay.classList.remove('active');
                    resolve(data);
                };
                const onCancel = () => {
                    modalOverlay.classList.remove('active');
                    reject(new Error(`用户取消了化合物 "${name}" 的数据输入`));
                };

                // 挂载一次性监听
                const confirmHandler = () => { onConfirm(); };
                const cancelHandler = () => { onCancel(); };
                modalConfirm.onclick = confirmHandler;
                modalCancel.onclick = cancelHandler;
                // 点击背景关闭 = 取消
                modalOverlay.onclick = (e) => {
                    if (e.target === modalOverlay) onCancel();
                };
                // Enter 键确认
                const keyHandler = (e) => {
                    if (e.key === 'Enter') onConfirm();
                };
                document.addEventListener('keydown', keyHandler);
                // 清理 (当模态框关闭时)
                const cleanup = () => {
                    modalConfirm.onclick = null;
                    modalCancel.onclick = null;
                    modalOverlay.onclick = null;
                    document.removeEventListener('keydown', keyHandler);
                };
                // 在 resolve / reject 中清理
                const origResolve = resolve;
                const origReject = reject;
                resolve = (val) => { cleanup();
                    origResolve(val); };
                reject = (err) => { cleanup();
                    origReject(err); };
            });
        }

        // ======================================================================
        //  5. 计算主逻辑
        // ======================================================================
        async function calculate() {
            // 读取输入
            const reactStr = elReact.value.trim();
            const prodStr = elProd.value.trim();
            const tempStr = elTemp.value.trim();
            const T = parseFloat(tempStr);

            // 验证
            if (!reactStr || !prodStr) {
                setMsg('请填写反应物和生成物', 'error');
                return;
            }
            if (isNaN(T) || T < 273.15) {
                setMsg('温度必须 ≥ 273.15 K', 'error');
                return;
            }

            // 解析化合物列表
            const reactants = reactStr.split(',').map(s => s.trim()).filter(s => s);
            const products = prodStr.split(',').map(s => s.trim()).filter(s => s);

            if (reactants.length === 0 || products.length === 0) {
                setMsg('请至少输入一种反应物和一种生成物', 'error');
                return;
            }

            try {
                setMsg('⏳ 正在读取数据...', 'info');

                // 获取所有反应物数据
                let S_react = 0,
                    Hf_react = 0,
                    Cp_react = 0;
                for (const name of reactants) {
                    const d = await getCompoundData(name);
                    S_react += d.S;
                    Hf_react += d.Hf;
                    Cp_react += d.Cp;
                }

                // 获取所有生成物数据
                let S_prod = 0,
                    Hf_prod = 0,
                    Cp_prod = 0;
                for (const name of products) {
                    const d = await getCompoundData(name);
                    S_prod += d.S;
                    Hf_prod += d.Hf;
                    Cp_prod += d.Cp;
                }

                // 计算反应参数
                const dS_0 = S_prod - S_react; // J/(mol·K)
                const dH_0 = Hf_prod - Hf_react; // kJ/mol
                const dCp = Cp_prod - Cp_react; // J/(mol·K)
                const dH_0_J = dH_0 * 1000; // J/mol

                const T0 = 298.15;

                // 在指定温度 T 下的值
                const dS_sys = dS_0 + dCp * Math.log(T / T0);
                const dH_sys = dH_0_J + dCp * (T - T0);
                const dS_surr = -dH_sys / T;
                const dS_total = dS_sys + dS_surr;

                // 更新结果卡片
                elResSys.textContent = dS_sys.toFixed(2);
                elResSurr.textContent = dS_surr.toFixed(2);
                elResTotal.textContent = dS_total.toFixed(2);

                setMsg(`✅ 计算成功：ΔS₀ = ${dS_0.toFixed(2)} J/(mol·K)  ΔH₀ = ${dH_0.toFixed(2)} kJ/mol  ΔCp = ${dCp.toFixed(2)} J/(mol·K)`,
                    'success');

                // 绘制图表
                drawCharts(dS_0, dH_0_J, dCp, T, dS_sys, dS_surr, dS_total, reactStr, prodStr);

            } catch (err) {
                setMsg(`❌ ${err.message}`, 'error');
                console.error(err);
            }
        }

        // ======================================================================
        //  6. 绘制图表 (使用 Chart.js)
        // ======================================================================
        function drawCharts(dS_0, dH_0_J, dCp, T_user, dS_sys, dS_surr, dS_total, reactStr, prodStr) {
            const T0 = 298.15;
            const T_min = 273.15;
            const T_max = 2000;
            const step = 2; // 步长 2K，平衡性能与精度
            const labels = [];
            const dataSys = [];
            const dataSurr = [];
            const dataTotal = [];

            for (let t = T_min; t <= T_max; t += step) {
                const tRound = Math.round(t * 100) / 100;
                labels.push(tRound);
                const sys = dS_0 + dCp * Math.log(tRound / T0);
                const h = dH_0_J + dCp * (tRound - T0);
                const surr = -h / tRound;
                const total = sys + surr;
                dataSys.push(sys);
                dataSurr.push(surr);
                dataTotal.push(total);
            }

            // 销毁旧图表
            if (chartSys) { chartSys.destroy();
                chartSys = null; }
            if (chartSurr) { chartSurr.destroy();
                chartSurr = null; }
            if (chartTotal) { chartTotal.destroy();
                chartTotal = null; }

            // ---- 通用配置 ----
            const commonOpts = {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { display: false },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    x: {
                        title: { display: true, text: '温度 T / K', font: { size: 12 } },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        title: { display: true, text: 'ΔS / (J·mol⁻¹·K⁻¹)', font: { size: 12 } },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                },
                elements: {
                    point: { radius: 0 },
                    line: { borderWidth: 2.2, tension: 0.3 }
                }
            };

            // ---- 图1: 系统熵变 (蓝色) ----
            const ctxSys = canvasSys.getContext('2d');
            chartSys = new Chart(ctxSys, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'ΔS_系',
                        data: dataSys,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37,99,235,0.08)',
                        fill: true
                    }]
                },
                options: {
                    ...commonOpts,
                    plugins: {
                        ...commonOpts.plugins,
                        title: { display: true, text: `系统熵变  (${reactStr} → ${prodStr})`, font: { size: 13 } }
                    }
                }
            });

            // ---- 图2: 环境熵变 (红色) ----
            const ctxSurr = canvasSurr.getContext('2d');
            chartSurr = new Chart(ctxSurr, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'ΔS_环',
                        data: dataSurr,
                        borderColor: '#dc2626',
                        backgroundColor: 'rgba(220,38,38,0.08)',
                        fill: true
                    }]
                },
                options: {
                    ...commonOpts,
                    plugins: {
                        ...commonOpts.plugins,
                        title: { display: true, text: `环境熵变  (${reactStr} → ${prodStr})`, font: { size: 13 } }
                    }
                }
            });

            // ---- 图3: 总熵变 (黑色) + 参考线 ----
            const ctxTotal = canvasTotal.getContext('2d');
            chartTotal = new Chart(ctxTotal, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'ΔS_总',
                        data: dataTotal,
                        borderColor: '#1e293b',
                        backgroundColor: 'rgba(30,41,59,0.08)',
                        fill: true,
                        pointRadius: 0
                    }, {
                        label: 'ΔS = 0',
                        data: Array(labels.length).fill(0),
                        borderColor: '#94a3b8',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false },
                        title: { display: true, text: `总熵变 (宇宙)  (${reactStr} → ${prodStr})`, font: { size: 13 } }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: '温度 T / K', font: { size: 12 } },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        y: {
                            title: { display: true, text: 'ΔS_总 / (J·mol⁻¹·K⁻¹)', font: { size: 12 } },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        }
                    },
                    elements: {
                        point: { radius: 0 },
                        line: { borderWidth: 2.2, tension: 0.3 }
                    }
                }
            });
        }

        // ======================================================================
        //  7. 辅助函数
        // ======================================================================
        function setMsg(text, type = 'info') {
            elMsg.textContent = text;
            elMsg.className = 'msg-bar ' + type;
        }

        // ======================================================================
        //  8. 事件绑定
        // ======================================================================
        elCalc.addEventListener('click', calculate);
        elTemp.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
        elReact.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });
        elProd.addEventListener('keydown', (e) => { if (e.key === 'Enter') calculate(); });

        // ======================================================================
        //  9. 退出按钮：跳转回游戏.html（启动器界面）
        // ======================================================================
        elExit.addEventListener('click', function() {
            // 直接跳转，不弹确认框，体验更流畅
            window.location.href = 'index.html';
        });

        // ======================================================================
        //  10. 启动时自动计算一次 (展示默认示例)
        // ======================================================================
        window.addEventListener('load', () => {
            setTimeout(calculate, 300);
        });

        // ======================================================================
        //  11. 处理模态框 Enter 键 (已在 getCompoundData 中处理)
        // ======================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                modalCancel.click();
            }
        });

        console.log('✅ 热力学熵变计算器已加载，化合物数量:', compDB.size);
    </script>
</body>
</html>
